<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: Arial, sans-serif;
        background: url('images/main.jpg') center center / cover no-repeat;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        text-align: center;
        padding: 20px;
    }

    h1 {
        margin-bottom: 10px;
        font-size: 2.5rem;
        line-height: 1.2;
    }

    .subtitle {
        margin-bottom: 400px;
        font-size: 1rem;
        color: rgba(255,255,255,0.85);
        letter-spacing: 0.02em;
    }

    .icon-row {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 50px;
    }

    .icon-link {
        text-decoration: none;
        color: white;
    }

    .icon-link img {
        width: 125px;
        height: 125px;
        transition: transform 0.3s ease;
        display: block;
    }

    .icon-link:hover img {
        transform: scale(1.15);
    }

    .icon-label {
        margin-top: 12px;
        color: white;
        font-size: 18px;
    }

    .github-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
    }

    .small-icon img {
        width: 90px;
        height: 90px;
    }
   @media (max-width: 768px) {
       .subtitle {
        margin-bottom: 120px;
    }

    .icon-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        justify-content: flex-start;
        padding: 10px 20px;
        width: 100vw;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    .icon-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        justify-content: flex-start;
        padding: 10px 20px;
        width: 100vw;

        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .icon-row::-webkit-scrollbar {
        display: none;
    }

    .icon-row > * {
        flex-shrink: 0;
    }

    .icon-link img {
        width: 90px;
        height: 90px;
    }

    .small-icon img {
        width: 75px;
        height: 75px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon-row">

           target="_blank"
           rel="noopener noreferrer"
           title="The Greenman's Show Videos">
            <img src="images/youtube.png" alt="YouTube">
            <div class="icon-label">YouTube</div>
        </a>



        <!-- GitHub + Projects -->

            </a>

            <a class="icon-link small-icon"
               href="https://hellomilan03.github.io/HP15C-style-HTML-Calculator-Milan-Greenman/"

               title="MG-15C Advanced Scientific Calculator">
                <img src="images/calc.png" alt="Calc">

            </a>

                <img src="images/pong.png" alt="Pong">

        <a class="icon-link"
           href="https://www.printables.com/@TheGreenmanS_1381837/models"
